# Builds the Linux .deb and macOS .dmg and attaches them to an existing release.
# Windows builds still come from package.ps1.
name: Linux and macOS builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (e.g. v0.3.5)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
            out: target/release/bundle/deb/*.deb
          - os: macos-latest
            args: --target universal-apple-darwin
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
      - run: npx --yes @tauri-apps/cli@2.12.4 build ${{ matrix.args }}
      - run: gh release upload "${{ inputs.tag }}" ${{ matrix.out }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
