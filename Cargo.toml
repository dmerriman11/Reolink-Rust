[package]
name = "reolink-rs"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
get_if_addrs = "0.5"
log = "0.4.34"
neolink_core = { path = "neolink_core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12", features = ["custom-protocol"] }
tokio = { version = "1.54.1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
