[package]
name = "reolink-rs"
version = "0.3.5"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
env_logger = "0.11.11"
futures = "0.3"
get_if_addrs = "0.5"
log = "0.4.34"
neolink_core = { path = "neolink_core" }
quick-xml = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[workspace]
members = [".", "neolink_core"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
