<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reolink-rs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Reolink<em>rs</em></span>
    </div>
    <nav class="views" aria-label="View">
      <button class="view-btn" id="view-live" aria-pressed="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg>
        Live view
      </button>
      <button class="view-btn" id="view-playback" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/></svg>
        Playback
      </button>
    </nav>
    <div class="section-head">
      <h2>Devices</h2>
      <button class="icon-btn" id="add-device" title="Add device" aria-label="Add device">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <ul class="device-list" id="device-list"></ul>
    <p class="empty-hint" id="empty-hint" hidden>No devices yet. Add a camera by IP or UID.</p>
    <section class="nearby" id="nearby" hidden>
      <div class="section-head">
        <h2>Found nearby</h2>
        <button class="icon-btn" id="rescan" title="Scan network again" aria-label="Scan network again">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
        </button>
      </div>
      <ul class="nearby-list" id="nearby-list"></ul>
    </section>
  </aside>

  <main class="stage">
    <header class="topbar">
      <div class="topbar-left">
      <button class="icon-btn" id="sidebar-toggle" title="Hide device panel" aria-label="Toggle device panel" aria-expanded="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <div class="layouts" role="radiogroup" aria-label="Layout" id="layouts"></div>
      </div>
      <div class="topbar-right">
        <button class="ghost-btn" id="app-settings" title="App settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Settings
        </button>
        <button class="ghost-btn" id="fullscreen" title="Full screen (Esc to exit)">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          Full screen
        </button>
        <button class="ghost-btn" id="media-folder">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Media
        </button>
      </div>
    </header>
    <section class="grid" id="grid"></section>
    <button class="fs-exit" id="fs-exit" title="Exit full screen (Esc)" aria-label="Exit full screen">
      <svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
  </main>

  <main class="nvr" id="nvr" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <div class="day-nav">
          <button class="icon-btn" id="pb-prev-day" title="Previous day" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
          <input type="date" id="pb-day" aria-label="Day">
          <button class="icon-btn" id="pb-next-day" title="Next day" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="ghost-btn" id="pb-latest" title="Jump to the latest recording">Latest</button>
        </div>
        <span class="pb-summary" id="pb-summary"></span>
      </div>
      <div class="topbar-right">
        <button class="ghost-btn" id="pb-media">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Media
        </button>
      </div>
    </header>

    <div class="pb-body">
      <section class="pb-player" id="pb-player">
        <video id="pb-video" preload="auto" playsinline></video>
        <div class="pb-overlay">
          <span class="pb-cam" id="pb-cam"></span>
          <span class="pb-clock" id="pb-clock"></span>
        </div>
        <div class="pb-msg" id="pb-msg">Pick a recording on the timeline.</div>
      </section>

      <aside class="pb-files">
        <div class="section-head"><h2 id="pb-files-title">Recordings</h2></div>
        <ul class="pb-file-list" id="pb-file-list"></ul>
      </aside>
    </div>

    <div class="pb-transport" id="pb-transport">
      <div class="pb-group">
        <button class="tbtn" data-act="prev" title="Previous recording" aria-label="Previous recording"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg></button>
        <button class="tbtn" data-act="back" title="Back 10 s (←)" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></svg></button>
        <button class="tbtn" data-act="frame-back" title="Previous frame (,)" aria-label="Previous frame"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="tbtn play" data-act="play" id="pb-play" title="Play (Space)" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="tbtn" data-act="frame-fwd" title="Next frame (.)" aria-label="Next frame"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="tbtn" data-act="fwd" title="Forward 10 s (→)" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M13 6l6 6-6 6M5 6l6 6-6 6"/></svg></button>
        <button class="tbtn" data-act="next" title="Next recording" aria-label="Next recording"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></svg></button>
        <label class="pb-speed" title="Playback speed ([ and ])">
          <select id="pb-speed" aria-label="Playback speed"></select>
        </label>
      </div>
      <div class="pb-group">
        <button class="ghost-btn" data-act="in" title="Mark clip start (I)">In</button>
        <button class="ghost-btn" data-act="out" title="Mark clip end (O)">Out</button>
        <button class="ghost-btn" data-act="export" id="pb-export" disabled>Export clip</button>
        <button class="ghost-btn" data-act="still" title="Save this frame to the snapshot folder">
          <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Snapshot
        </button>
        <button class="tbtn" data-act="full" title="Full screen (F)" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>

    <section class="timeline" id="timeline">
      <div class="tl-zoom" role="group" aria-label="Timeline zoom">
        <button data-span="86400" aria-pressed="true">24h</button>
        <button data-span="21600">6h</button>
        <button data-span="3600">1h</button>
        <button data-span="600">10m</button>
      </div>
      <div class="tl-ruler" id="tl-ruler"></div>
      <div class="tl-rows" id="tl-rows"></div>
      <p class="tl-hint">Click to play · scroll to zoom · drag to pan</p>
    </section>
  </main>

  <aside class="ptz" id="ptz">
    <button class="ptz-toggle" id="ptz-toggle" aria-label="Toggle PTZ panel" aria-expanded="true">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="ptz-body">
      <h2>PTZ</h2>
      <p class="ptz-target" id="ptz-target">Select a live tile</p>
      <div class="dpad" id="dpad">
        <button data-dir="up" class="d-up" aria-label="Tilt up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <button data-dir="left" class="d-left" aria-label="Pan left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span class="d-hub" aria-hidden="true"></span>
        <button data-dir="right" class="d-right" aria-label="Pan right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button data-dir="down" class="d-down" aria-label="Tilt down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <p class="ptz-hint">Press and hold to move.</p>
    </div>
  </aside>

  <dialog id="device-dialog">
    <form method="dialog" id="device-form">
      <h3 id="dialog-title">Add device</h3>
      <label>Name<input name="name" required autocomplete="off"></label>
      <div class="row">
        <label>IP / Host<input name="host" autocomplete="off" placeholder="192.168.1.10"></label>
        <label class="narrow">Port<input name="port" inputmode="numeric" placeholder="9000"></label>
      </div>
      <label>UID<input name="uid" autocomplete="off" placeholder="Needed for battery & remote cameras"></label>
      <div class="row">
        <label>Username<input name="username" autocomplete="off" value="admin"></label>
        <label>Password<input name="password" type="password" autocomplete="new-password"></label>
      </div>
      <label class="narrow">Channel<input name="channel" type="number" min="0" max="63" value="0"></label>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="actions">
        <button type="button" class="ghost-btn" id="dialog-cancel">Cancel</button>
        <button type="submit" class="primary-btn">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="settings-dialog">
    <div class="settings-shell">
      <nav class="settings-nav" id="settings-nav" aria-label="Settings pages"></nav>
      <section class="settings-main">
        <header class="settings-head">
          <div>
            <p class="settings-kicker" id="settings-kicker"></p>
            <h3 id="settings-title"></h3>
          </div>
          <button class="icon-btn" id="settings-close" aria-label="Close settings">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <div class="settings-body" id="settings-body"></div>
        <footer class="settings-foot">
          <div class="settings-actions" id="settings-actions"></div>
          <span class="settings-status" id="settings-status" role="status"></span>
          <button type="button" class="ghost-btn" id="settings-revert" disabled>Undo changes</button>
          <button type="button" class="primary-btn" id="settings-save" disabled>Save</button>
        </footer>
      </section>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
